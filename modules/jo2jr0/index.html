<section class="modulex-sayac-raf-etiket{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-raf-etiket-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sayac-raf-etiket — sayac-kart-ikon düz kartlar, sayac-brutal sert gölgeli çerçeveler kurar; bu modül ortak bir raf rayı + ip + delikli/köşesi kesik etiket + barkod iskeletidir ve notu tutamakla açar (mağaza rafı dili). */
  .modulex-sayac-raf-etiket { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-raf-etiket *, .modulex-sayac-raf-etiket *::before, .modulex-sayac-raf-etiket *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-raf-etiket :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-raf-etiket :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-raf-etiket :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-raf-etiket :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-raf-etiket img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-raf-etiket) img { height: auto; }
  .modulex-sayac-raf-etiket [hidden] { display: none !important; }
  .modulex-sayac-raf-etiket :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-raf-etiket :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-raf-etiket-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-raf-etiket-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-raf-etiket--bassiz .modulex-sayac-raf-etiket-bas { display: none; }
  .modulex-sayac-raf-etiket-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-raf-etiket-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-raf-etiket-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-raf-etiket-bas { max-width: 760px; }
  .modulex-sayac-raf-etiket-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-raf-etiket-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-raf-etiket-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-raf-etiket-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-raf-etiket-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-raf-etiket-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-raf-etiket-raf { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 30px 28px; padding-inline: 14px; }
  .modulex-sayac-raf-etiket-ask { position: relative; display: grid; justify-items: center; padding-block-start: 44px; filter: drop-shadow(0 14px 16px color-mix(in srgb, --text-- 16%, transparent)); }
  .modulex-sayac-raf-etiket-ask::before { content: ""; position: absolute; inset-block-start: 0; inset-inline: -15px; height: 12px; border-radius: 3px; background: linear-gradient(180deg, color-mix(in srgb, --text-- 45%, --bg--), color-mix(in srgb, --text-- 75%, --bg--)); }
  .modulex-sayac-raf-etiket-ask::after { content: ""; position: absolute; inset-block-start: 12px; inset-inline-start: calc(50% - 1px); width: 2px; height: 46px; background: --muted--; }
  .modulex-sayac-raf-etiket-fiyat { position: relative; display: grid; justify-items: center; gap: 6px; width: min(100%, 230px); padding: 40px 20px 18px; background: color-mix(in srgb, --accent-- 14%, --bg--); clip-path: polygon(22% 0, 78% 0, 100% 16%, 100% 100%, 0 100%, 0 16%); text-align: center; transform: rotate(var(--r)); transform-origin: 50% -40px; transition: transform 0.5s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .modulex-sayac-raf-etiket-ask:hover .modulex-sayac-raf-etiket-fiyat { animation: modulex-sayac-raf-etiket-sallan 1.2s ease-in-out 2; }
  @keyframes modulex-sayac-raf-etiket-sallan { 25% { transform: rotate(calc(var(--r) * -2)); } 75% { transform: rotate(calc(var(--r) * 2)); } }
  .modulex-sayac-raf-etiket-delik { position: absolute; inset-block-start: 12px; inset-inline-start: calc(50% - 8px); z-index: 1; width: 16px; height: 16px; border: 3px solid color-mix(in srgb, --text-- 30%, --bg--); border-radius: 50%; background: --bg--; }
  .modulex-sayac-raf-etiket-ikon { color: --accentInk--; font-size: 24px; }
  .modulex-sayac-raf-etiket-sayi { font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 1; }
  .modulex-sayac-raf-etiket-ek { color: --accentInk--; font-size: 0.48em; }
  .modulex-sayac-raf-etiket-etiket { font-size: 0.95rem; font-weight: 700; line-height: 1.3; }
  .modulex-sayac-raf-etiket-ac { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 2px solid --cizgi--; border-radius: 50%; background: --bg--; transition: transform 0.3s ease, border-color 0.25s ease; }
  .modulex-sayac-raf-etiket-ac:hover { border-color: --accent--; }
  .modulex-sayac-raf-etiket-ac .material-symbols-outlined { font-size: 20px; transition: transform 0.3s ease; }
  .modulex-sayac-raf-etiket-ac.modulex-sayac-raf-etiket--acik .material-symbols-outlined { transform: rotate(180deg); }
  .modulex-sayac-raf-etiket:not(.modulex-sayac-raf-etiket--hazir) .modulex-sayac-raf-etiket-ac { display: none; }
  .modulex-sayac-raf-etiket-arka { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.35s ease, visibility 0.35s; }
  .modulex-sayac-raf-etiket--hazir .modulex-sayac-raf-etiket-ac:not(.modulex-sayac-raf-etiket--acik) + .modulex-sayac-raf-etiket-arka { grid-template-rows: 0fr; visibility: hidden; }
  .modulex-sayac-raf-etiket-not { min-height: 0; overflow: hidden; color: --muted--; font-size: 0.9rem; }
  .modulex-sayac-raf-etiket-barkod { width: 72%; height: 22px; margin-block-start: 6px; background: repeating-linear-gradient(90deg, --text-- 0 2px, transparent 2px 4px, --text-- 4px 5px, transparent 5px 8px, --text-- 8px 11px, transparent 11px 13px); opacity: 0.75; }
  @media (max-width: 768px) {
    .modulex-sayac-raf-etiket-raf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px; padding-inline: 8px; }
    .modulex-sayac-raf-etiket-ask::before { inset-inline: -8px; }
    .modulex-sayac-raf-etiket-fiyat { padding: 36px 10px 14px; }
    .modulex-sayac-raf-etiket-sayi { font-size: 1.9rem; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-raf-etiket :is(.modulex-sayac-raf-etiket-baslik, .modulex-sayac-raf-etiket-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-raf-etiket-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-raf-etiket { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-raf-etiket *, .modulex-sayac-raf-etiket *::before, .modulex-sayac-raf-etiket *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-raf-etiket";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    const cevir = (s, P) => {
        s.querySelectorAll("[data-cevir]").forEach((k) => {
          const tog = () => { const a = k.classList.toggle(P + "--acik"); k.setAttribute("aria-expanded", String(a)); };
          k.addEventListener("click", (e) => { if (!e.target.closest("a")) tog(); });
          k.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
      cevir(s, P, az);
    });
  })();
</script>
