  @media (prefers-reduced-motion: reduce) {

<script>
  (() => {
    const P = "modulex-galeri-genis-detay";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const genislet = (s, P) => {
        const L = s.querySelector("[data-gd-liste]");
        const pan = s.querySelector("[data-gd-panel]");
        const T = [...s.querySelectorAll("a[data-gd]")];
        if (!L || !pan || !T.length) return;
        s.classList.add(P + "--gjs");
        const kutu = pan.querySelector("[data-gd-gorsel]");
        const img = document.createElement("img");
        img.className = P + "-dimg";
        img.alt = "";
        img.decoding = "async";
        if (kutu) kutu.append(img);
        const yaz = (q, v) => { const e = pan.querySelector(q); if (e) { e.textContent = v || ""; e.hidden = !v; } };
        const G = [...pan.querySelectorAll("[data-gd-git]")];
        G.forEach((b) => { b.hidden = T.length < 2; });
        let n = -1;
        const yerles = () => {
          if (n < 0) return;
          const li = T[n].closest("li");
          pan.hidden = true;
          let son = li;
          [...L.children].forEach((x) => { if (x !== pan && Math.abs(x.offsetTop - li.offsetTop) < 2) son = x; });
          son.after(pan);
          pan.hidden = false;
          const r = li.getBoundingClientRect();
          const q = L.getBoundingClientRect();
          const rtl = getComputedStyle(L).direction === "rtl";
          pan.style.setProperty("--x", Math.round(rtl ? q.right - r.right + r.width / 2 : r.left - q.left + r.width / 2) + "px");
        };
        const ac = (i) => {
          n = (i + T.length) % T.length;
          const a = T[n];
          T.forEach((x, j) => x.setAttribute("aria-expanded", String(j === n)));
          img.src = a.getAttribute("href");
          img.alt = a.dataset.alt || "";
          yaz("[data-gd-kat]", a.dataset.kat);
          yaz("[data-gd-bas]", a.dataset.baslik);
          yaz("[data-gd-met]", a.dataset.metin);
          yerles();
        };
        const kapat = (odak) => {
          if (n < 0) return;
          const a = T[n];
          a.setAttribute("aria-expanded", "false");
          pan.hidden = true;
          n = -1;
          if (odak) a.focus();
        };
        T.forEach((a, i) => a.addEventListener("click", (e) => {
          if (e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
          e.preventDefault();
          if (n === i) kapat(false);
          else ac(i);
        }));
        G.forEach((b) => b.addEventListener("click", () => ac(n + Number(b.dataset.gdGit))));
        const k = pan.querySelector("[data-gd-kapat]");
        if (k) k.addEventListener("click", () => kapat(true));
        s.addEventListener("keydown", (e) => { if (e.key === "Escape" && n > -1) { e.preventDefault(); kapat(true); } });
        let bekle = 0;
        window.addEventListener("resize", () => { clearTimeout(bekle); bekle = setTimeout(yerles, 120); });
        ac(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      genislet(s, P, az);
    });
  })();
</script>
